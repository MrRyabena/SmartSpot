[platformio]
src_dir = SmartSpot/

[env]
framework = arduino
monitor_speed = 115200
lib_deps =     
    C:\users\daniil\SHS\src\SHScore
    C:\users\daniil\SHS\src\SHSlibrary\SHS_Color
    C:\users\daniil\SHS\src\SHSlibrary\SHS_RgbDriver
    C:\users\daniil\SHS\src\SHSlibrary\SHS_APIids
    C:\users\daniil\SHS\src\SHSlibrary\SHS_SensorTypes
    C:\users\daniil\SHS\src\SHSlibrary\SHS_Thermistor
    C:\users\daniil\SHS\src\SHSlibrary\SHS_DS18
    C:\users\daniil\SHS\src\SHSsettings
    ../../SHS_SmartSpot

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = nodemcu-32s
upload_speed = 921600
build_type = release
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_flags = -w

[env:esp32_debug]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = nodemcu-32s
upload_speed = 921600
build_type = debug
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_flags = -w
              -D SHS_SF_DEBUG
